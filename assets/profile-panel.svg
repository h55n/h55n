  <text x="52" y="104" fill="#F6F8FB" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="800">ideas -&gt; systems -&gt; products.</text>
  <text x="52" y="132" fill="#AEBACC" font-family="Inter,Segoe UI,sans-serif" font-size="14">I build across AI, applied ML, product engineering, and the strange spaces between them.</text>

