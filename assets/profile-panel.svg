  <text x="52" y="208" fill="#D7DEE8" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">AI engineer / builder.</text>
  <text x="52" y="231" fill="#B7C3D1" font-family="Inter,Segoe UI,sans-serif" font-size="13">I like taking ambitious ideas and pushing them until they become real systems.</text>
  <text x="52" y="251" fill="#B7C3D1" font-family="Inter,Segoe UI,sans-serif" font-size="13">Memory, data, safety, latency, design, product feel - I care about the whole thing.</text>

